name: tennis-watch

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:          # Actions 화면의 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write             # state.json 저장용

concurrency:
  group: tennis-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUTF8: "1"
        run: python watch_cloud.py
      - name: Save state
        run: |
          git config user.name "tennis-watch"
          git config user.email "tennis-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
